name: CI

on:
  push:
    branches: [main, develop, "fix/**", "chore/**", "feat/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Le CHANGELOG peut être servi à tout le monde (ADR-0004, /__version__)
        run: python3 scripts/verif-changelog.py CHANGELOG.md
      - name: Bandit (SAST)
        run: bandit -r app -c pyproject.toml
      - name: pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt || true  # report-only initially
      - name: Semgrep (SAST)
        run: semgrep --config auto app || true       # report-only initially
      - name: Pytest (unit)
        # Les tests `integration` nécessitant Keycloak, un navigateur ou un
        # serveur live ne tournent pas ici. Ceux qui n'ont besoin que d'un
        # Postgres sont couverts par le job `integration-db` ci-dessous.
        run: pytest -m "not integration"

  # Les règles métier des campagnes (coexistence, précédence, contraintes de
  # schéma) sont du SQL : mockées, elles ne seraient vérifiées que comme des
  # chaînes de caractères. Ce job les exécute contre un vrai PostgreSQL.
  integration-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bootstrap
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # La migration du chart (Job alembic) part d'une base VIDE : on la joue ici, sur une
      # base dédiée, pour que l'image ne parte pas avec une chaîne de migration cassée.
      - name: Alembic upgrade head sur une base vide
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrations
        run: |
          python - <<'PY'
          import psycopg2
          c = psycopg2.connect("postgresql://postgres:postgres@localhost:5432/bootstrap")
          c.autocommit = True
          c.cursor().execute("CREATE DATABASE migrations")
          PY
          alembic upgrade head
          alembic current
      - name: Pytest (intégration Postgres)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bootstrap
        # Liste explicite : les autres fichiers `integration` réclament Keycloak,
        # un navigateur ou un serveur déployé, indisponibles sur le runner.
        run: |
          pytest -m integration \
            tests/test_experiment_campaigns_pg.py \
            tests/test_general_version_pg.py \
            tests/test_libreoffice_update_feed_pg.py \
            tests/test_plugin_installations_fk.py

  # ADR-0004 : l'image porte son journal (/app/version.json servi sur /__version__, format
  # Dockerflow). Ce job construit l'image sans la pousser et vérifie qu'elle dit la même
  # chose que le dépôt : version = fichier VERSION, commit = SHA construit.
  image-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Construire l'image (amd64, sans push)
        env:
          COMMIT: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          BUILD: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          docker build -f deploy/docker/Dockerfile -t dm:ci \
            --build-arg DM_IMAGE_TAG="$VERSION" --build-arg COMMIT="$COMMIT" \
            --build-arg BUILD="$BUILD" --build-arg CODE_DATE="$(git log -1 --format=%cI)" \
            --build-arg SOURCE="$SOURCE" .
      - name: L'image dit la même chose que le dépôt
        env:
          COMMIT: ${{ github.sha }}
        run: |
          bash scripts/verif-version.sh --image dm:ci --tag "$(tr -d '[:space:]' < VERSION)" --commit "$COMMIT"
