# Default values for the device-management chart.
# This file is the primary reference for every configurable knob: every key
# below is commented with its purpose, whether it is required, and its
# default. See README.md for an install matrix (prod vs dev) and upgrade notes.

# -----------------------------------------------------------------------------
# Container image
# -----------------------------------------------------------------------------
image:
  # Registry hostname (e.g. "ghcr.io" or "docker.io"). Optional: leave empty to
  # use `repository` as a fully-qualified reference.
  registry: "ghcr.io"
  # Image repository. Required. Public image published by this repository's
  # CI (fabnum-cicd): `X.Y.Z` on release from main, `develop-<sha8>` from
  # develop. Override with `--set image.repository=...` for a mirror.
  repository: ia-generative/device-management
  # Image tag. Optional: defaults to .Chart.AppVersion when empty.
  tag: ""
  # Pull policy for all containers using this image. Optional.
  pullPolicy: Always

# List of imagePullSecrets (names of pre-existing Secrets of type
# kubernetes.io/dockerconfigjson) attached to every pod's spec. Optional,
# required in practice for any private registry.
imagePullSecrets: []
# - name: regcred

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Service account
# -----------------------------------------------------------------------------
serviceAccount:
  # Create a ServiceAccount. Optional, default true.
  create: true
  # Name of the ServiceAccount to use. Optional: defaults to the chart
  # fullname when empty and `create: true`; must reference an existing
  # ServiceAccount when `create: false`.
  name: ""
  annotations: {}

# -----------------------------------------------------------------------------
# Pod-level security context (applied to every Deployment)
# -----------------------------------------------------------------------------
podSecurityContext:
  # Optional, default true. The app image already runs as a fixed non-root
  # uid (10001) baked into the Dockerfile (`USER 10001`).
  runAsNonRoot: true
  # Optional, default 10001 (matches the image's built-in user). Set to
  # `null` on OpenShift: the cluster's SCC (restricted-v2) assigns an
  # arbitrary uid itself and rejects pods that pin one explicitly.
  runAsUser: 10001
  runAsGroup: null
  fsGroup: null
  # Optional, default RuntimeDefault. Set to "" to omit the field entirely
  # (some older CRI/PSP combinations reject it).
  seccompProfileType: RuntimeDefault

# -----------------------------------------------------------------------------
# Container-level security context (applied to every app container)
# -----------------------------------------------------------------------------
containerSecurityContext:
  allowPrivilegeEscalation: false
  # Optional, default true. The app writes nothing to its own image layer;
  # /tmp is provided via emptyDir (see `extraVolumes` per component).
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Labels/annotations merged into every object's metadata. Optional.
commonLabels: {}
commonAnnotations: {}

# -----------------------------------------------------------------------------
# api — main FastAPI deployment (DM_RUNTIME_MODE=api). Serves enrollment,
# binaries/config distribution, the browser-extension relay authorize
# endpoint and the Postgres-backed job queue producer side.
# -----------------------------------------------------------------------------
api:
  enabled: true
  # Optional, default 4. Ignored when autoscaling.enabled=true.
  replicaCount: 4

  # Rolling update strategy. Safe because binaries/enroll storage is S3-backed
  # by default (config.storage.storeEnrollS3=true) — pods are stateless, so a
  # surge-then-drain rollout never touches shared state.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # Optional, default 30. Must cover the preStop sleep (5s) plus uvicorn's
  # --timeout-graceful-shutdown so in-flight requests finish before the pod
  # is killed.
  terminationGracePeriodSeconds: 30

  service:
    type: ClusterIP
    port: 80
    targetPort: 3001

  # uvicorn tuning (DM_UVICORN_*). Optional.
  uvicorn:
    workers: 4
    accessLog: false
    timeoutKeepAliveSeconds: 15

  # Postgres-backed job queue (producer side, consumed by the worker
  # deployment). Optional; DM_QUEUE_ENABLED=false disables enqueueing.
  queue:
    enabled: true
    batchSize: 50
    pollIntervalSeconds: 0.5
    lockTtlSeconds: 60
    defaultMaxAttempts: 8
    retryBaseSeconds: 2
    retryMaxSeconds: 300
    retryJitterSeconds: 1.0

  # Runtime config hot-reload (in-cluster, DB-backed cross-pod broadcast of
  # /admin/debug edits). Optional.
  runtimeConfig:
    pollIntervalSeconds: 3
    editable: true

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

  autoscaling:
    enabled: false
    minReplicas: 4
    maxReplicas: 20
    targetCPUUtilizationPercentage: 55
    targetMemoryUtilizationPercentage: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 30
          - type: Pods
            value: 6
            periodSeconds: 30
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 20
            periodSeconds: 60

  probes:
    startup:
      path: /livez
      periodSeconds: 2
      failureThreshold: 15
      timeoutSeconds: 3
    # /readyz reports 503 until the runtime config has loaded once.
    readiness:
      path: /readyz
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      path: /livez
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 4

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Extra env entries appended verbatim (list of corev1.EnvVar). Optional.
  extraEnv: []
  # Extra volumes/volumeMounts appended verbatim. Optional.
  extraVolumes: []
  extraVolumeMounts: []

  # PodDisruptionBudget. maxUnavailable (not minAvailable) so it stays valid
  # regardless of the current replica count under autoscaling.enabled=true.
  pdb:
    enabled: true
    maxUnavailable: 1

# -----------------------------------------------------------------------------
# admin — back-office UI (DM_RUNTIME_MODE=admin). Single replica: it owns a
# writable content volume (uploaded binaries/config) and its OIDC session
# state is not designed to be sharded across replicas.
# -----------------------------------------------------------------------------
admin:
  enabled: true
  # Optional, default 1. Recreate strategy: keep at 1 unless the admin
  # content volume becomes ReadWriteMany (see persistence.accessModes).
  replicaCount: 1
  strategy:
    type: Recreate

  terminationGracePeriodSeconds: 30

  service:
    type: ClusterIP
    port: 80
    targetPort: 3001

  # Uploaded binaries/config content (distinct from api's S3-backed
  # enroll/binaries cache). Optional; RWO by default (single replica).
  persistence:
    enabled: true
    # Optional: reference a pre-existing PVC instead of creating one.
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    storageClassName: ""

  runtimeConfig:
    pollIntervalSeconds: 3
    editable: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    startup:
      path: /livez
      periodSeconds: 2
      failureThreshold: 15
      timeoutSeconds: 3
    readiness:
      path: /readyz
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      path: /livez
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 4

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# -----------------------------------------------------------------------------
# worker — queue consumer (DM_RUNTIME_MODE=worker, entrypoint
# `python -m app.worker_main`). Stateless besides the heartbeat file used by
# its liveness probe.
# -----------------------------------------------------------------------------
worker:
  enabled: true
  replicaCount: 2
  strategy:
    type: RollingUpdate

  terminationGracePeriodSeconds: 30

  queue:
    enabled: true
    batchSize: 100
    pollIntervalSeconds: 0.5
    lockTtlSeconds: 60
    defaultMaxAttempts: 8
    retryBaseSeconds: 2
    retryMaxSeconds: 300
    retryJitterSeconds: 1.0

  # Path to the heartbeat file the worker loop touches on every iteration.
  # The livenessProbe below considers the pod dead if this file is missing
  # or stale (no HTTP endpoint exists on this role). Optional.
  heartbeatFile: /tmp/dm-worker-heartbeat
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
    # Freshness window (seconds) checked by the probe script.
    maxAgeSeconds: 120

  # Init container blocking startup until Postgres accepts connections.
  # Optional; only meaningful when the DB is reachable from a plain
  # `pg_isready` call (skip it for managed DBs that require e.g. IAM auth).
  waitForPostgres:
    enabled: true
    image:
      repository: docker.io/library/postgres
      tag: 18-alpine
    # Hostname:port passed to `pg_isready -h`. Defaults to the internal
    # postgres service name when postgres.internal.enabled=true, otherwise
    # must be set explicitly (external DB host).
    host: ""
    # Also used by migration.waitForPostgres's init container (same image,
    # same tiny footprint — a loop of `pg_isready` calls).
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 12
    targetCPUUtilizationPercentage: 60
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 30
          - type: Pods
            value: 4
            periodSeconds: 30
      scaleDown:
        stabilizationWindowSeconds: 240
        policies:
          - type: Percent
            value: 20
            periodSeconds: 60

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

  pdb:
    enabled: true
    maxUnavailable: 1

# -----------------------------------------------------------------------------
# telemetryRelay — second instance of the same image (DM_RUNTIME_MODE=api,
# implicit default) dedicated to telemetry ingestion only. Isolated from the
# main api deployment so telemetry traffic/config never shares its blast
# radius (DM_CONFIG_ENABLED=false, no local/S3 enroll storage on this role).
# -----------------------------------------------------------------------------
telemetryRelay:
  enabled: true
  replicaCount: 1

  service:
    type: ClusterIP
    port: 80
    targetPort: 3001

  runtimeConfig:
    pollIntervalSeconds: 3
    editable: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  probes:
    startup:
      path: /livez
      periodSeconds: 2
      # 60s budget: cold boot after a fresh image pull on a loaded node
      # exceeded the previous 16s window and caused spurious restarts.
      failureThreshold: 30
      timeoutSeconds: 2
    readiness:
      path: /readyz
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      path: /livez
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 2
      failureThreshold: 3

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

  # PodDisruptionBudget. Disabled by default: replicaCount defaults to 1
  # (single instance), where a maxUnavailable:1 PDB would block voluntary
  # node drains entirely. Enable once replicaCount/autoscaling.minReplicas
  # is raised above 1.
  pdb:
    enabled: false
    maxUnavailable: 1

# -----------------------------------------------------------------------------
# llmProxy — dedicated, stateless instance of the same image
# (DM_RUNTIME_MODE=llm) serving only the OpenAI-compatible /llm/v1 proxy
# routes + probes/metrics. No volumes/PVC: scales horizontally everywhere.
# Shared state (quotas, relay-key revocation, runtime config) lives in
# Postgres, so there is no session affinity requirement on its Service.
# Disabled by default — enable once secrets.values.LLM_BASE_URL/
# LLM_API_TOKEN (and optionally DEFAULT_MODEL_NAME/EMBD_MODEL_NAME/
# DM_LLM_TOKEN_SIGNING_KEY) are populated.
# -----------------------------------------------------------------------------
llmProxy:
  enabled: false
  replicaCount: 2

  service:
    type: ClusterIP
    port: 80
    targetPort: 3001

  runtimeConfig:
    pollIntervalSeconds: 3
    editable: true

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # I/O-bound workload (long-lived SSE streams): memory is the dominant
  # scaling signal, CPU stays low even under heavy concurrency.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 30
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 20
            periodSeconds: 60

  probes:
    startup:
      path: /livez
      periodSeconds: 2
      failureThreshold: 15
      timeoutSeconds: 3
    readiness:
      path: /readyz
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      path: /livez
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 4

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

  pdb:
    enabled: true
    maxUnavailable: 1

# -----------------------------------------------------------------------------
# relayAssistant — nginx reverse-proxy in front of Keycloak (OIDC endpoints for
# the extensions: certs, auth, token, userinfo) and, behind the api's
# /relay/authorize check, of companion services. Disabled by default.
# -----------------------------------------------------------------------------
relayAssistant:
  enabled: false
  replicaCount: 1
  # Unprivileged nginx: listens on 8080, runs under any UID (OpenShift
  # restricted SCC) with a read-only root filesystem.
  image:
    repository: docker.io/nginxinc/nginx-unprivileged
    tag: "1.31.7-alpine"
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    port: 80
  # DNS server nginx uses to resolve its upstreams. Empty = read from the pod's
  # /etc/resolv.conf at startup (recommended).
  resolver: ""
  # Cluster DNS domain, used to build the api's FQDN (the nginx resolver does
  # not expand short names).
  clusterDomain: cluster.local
  # Upstreams other than Keycloak (whose URL is config.relay.keycloakUpstream).
  # Empty = route not served.
  upstreams:
    mcrApi: ""
  # Dedicated Ingress: the relay is exposed under a path prefix that nginx
  # ingress strips (regex + rewrite). Host/className/tls default to `ingress`.
  ingress:
    enabled: false
    className: ""
    host: ""
    path: /relay-assistant(/|$)(.*)
    pathType: ImplementationSpecific
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    tls: []
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# migration — Alembic schema migration Job, run as a Helm hook
# (pre-install,pre-upgrade) before any Deployment is rolled out.
# -----------------------------------------------------------------------------
migration:
  enabled: true
  backoffLimit: 2
  # Hook weight: lower runs first. Optional.
  hookWeight: "-5"
  # Optional: keep succeeded/failed hook Jobs around for inspection instead
  # of Helm deleting them before the next run.
  hookDeletePolicy: before-hook-creation
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Init container blocking the migration Job until Postgres accepts
  # connections. Needed because this Job is a Helm hook (runs before any
  # other resource) but `postgres.internal`/`postgres.cnpg` provision the
  # database as an ordinary resource in the same release — on a first
  # install there is no guarantee the database exists yet when the hook
  # fires. A `helm.sh/hook-weight` ordering trick can't fix this: Helm only
  # waits for hook *Jobs* to complete, it has no notion of "ready" for a
  # Deployment or a CNPG Cluster CR, so the wait has to happen inside the
  # Job itself. Optional; only meaningful when the DB is reachable from a
  # plain `pg_isready` call (skip it for managed DBs that require e.g. IAM
  # auth).
  waitForPostgres:
    enabled: true
    # Reuses worker.waitForPostgres.image (same postgres-client image,
    # single source of truth).
    # Hostname passed to `pg_isready -h`. Defaults to the internal-postgres
    # or CNPG `-rw` service name when one of those modes is enabled,
    # otherwise must be set explicitly (external DB host).
    host: ""
    # Optional, default 300 (5 minutes). Generous enough to cover a CNPG
    # Cluster's first bootstrap (instance creation + PVC provisioning) on a
    # first install; the Job fails clearly once exceeded instead of
    # retrying forever.
    timeoutSeconds: 300

# -----------------------------------------------------------------------------
# ingress — optional single Ingress fronting api (/), admin (/admin) and
# telemetryRelay (/telemetry/v1). Disabled by default: production usually
# terminates TLS via a platform-specific object (OpenShift Route, Gateway
# API HTTPRoute, or a proxy in front of the cluster) not covered here.
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  annotations: {}
  # - host: device-management.example.invalid
  hosts:
    - host: device-management.example.invalid
      paths:
        - path: /admin
          pathType: Prefix
          service: admin
        - path: /telemetry/v1
          pathType: Prefix
          service: telemetryRelay
        - path: /llm
          pathType: Prefix
          service: llmProxy
        - path: /
          pathType: Prefix
          service: api
  tls: []
  # - secretName: device-management-tls
  #   hosts:
  #     - device-management.example.invalid

# -----------------------------------------------------------------------------
# config — non-secret application settings, rendered into a ConfigMap and
# consumed by every DM_* deployment via `envFrom`. Maps 1:1 to DM_* fields in
# app/settings.py plus the small set of siblings it derives from
# (KEYCLOAK_*, POSTGRES_DB/USER, AWS_REGION...). Nothing here is a secret —
# see the `secrets` section below for credentials.
# -----------------------------------------------------------------------------
config:
  app:
    # DM_APP_ENV. Optional, default "dev". Set to "prod" to enable the
    # startup guard that refuses default/placeholder secrets
    # (validate_security_config in app/main.py).
    env: prod
    # DM_CONFIG_PROFILE. Optional, free-form label surfaced in /admin.
    profile: prod
    # DM_CONFIG_ENABLED. Optional, default true. Set false on roles that
    # must not serve the runtime /config endpoint (e.g. telemetryRelay).
    configEnabled: true
    # DM_ENROLL_URL. Optional, default "/enroll". Path returned to clients
    # for the enrollment callback.
    enrollUrl: /bootstrap/enroll
    # DM_ALLOW_ORIGINS. Optional, default "*". CSV or "*"; CORS allow-list.
    allowOrigins: "*"
    # DM_MAX_BODY_SIZE_MB. Optional, default 10.
    maxBodySizeMb: 10
    # DM_PORT. Optional, default 3001. Must match containerPort/probes if
    # changed — the chart wires it through consistently.
    port: 3001
    # DM_TLS_VERIFY. Optional, default true. TLS certificate verification
    # toward satellite services (Keycloak/LLM/relay targets). Never disable
    # in production.
    tlsVerify: true
    # DM_BOOTSTRAP_URLS. Optional, default "". CSV of config-server bootstrap
    # URLs returned to enrolling clients, in priority order.
    bootstrapUrls: ""
    # DM_LOCAL_API_ALLOWED_ORIGINS. Optional. CSV of exact web origins
    # (scheme://host[:port]) allowed to call the extensions' local API (e.g.
    # Mon portail). Served to plugins as config.localApiAllowedOrigins;
    # empty = not served, the extension keeps its own setting.
    localApiAllowedOrigins: ""
    # DM_CONFIG_OVERRIDES (rendered as JSON). Keys of config.json imposed by
    # THIS deployment on every plugin, merged over the plugin's template and
    # BEFORE the keys the DM computes itself (telemetry, links, relays…) and
    # before per-plugin catalog overrides, which still win. Use it for plugin
    # settings that differ per environment (e.g. the Mes réunions base URL on
    # the integration instance). Keys that have their own variable (links,
    # bootstrapUrls, localApiAllowedOrigins…) are ignored. Empty = nothing.
    # Example:
    #   configOverrides:
    #     mesReunionsBaseUrl: "https://mesreunions.example"
    configOverrides: {}
    # DM_LINKS (rendered as JSON). Links distributed to EVERY application in
    # /config as `config.links` — a flat list the extension replaces as a
    # whole on each poll (never merged client-side). Each entry names the
    # ROLE of the link in the UI (`id`, stable kebab-case), not its
    # destination; the extension only renders the ids it knows.
    # Entry: {id, label (<=80), url (https://), hint? (<=200), hintUrl? (https://)}.
    # Hot-reloadable from the admin Config tab; the plugin's dm-config.json
    # template (default/profile `links`) and the catalogue override (key
    # `links`) refine it per application, merged BY id field by field.
    # Empty list = no link served.
    links:
      - id: search-portal
        label: "Chercher aussi dans d'autres sources avec le portail de recherche"
        url: "https://monportail.numerique-interieur.com/"
        hint: "en bêta : s'inscrire"
        hintUrl: "https://communaute.mirai.interieur.gouv.fr/invite/kguG2oQ"
      - id: beta-signup
        label: "Rejoindre la communauté bêta"
        url: "https://communaute.mirai.interieur.gouv.fr/invite/kguG2oQ"
      # Base URL only: the extension appends its own /_beta/retour?app=... path.
      - id: beta-feedback
        label: "Donner mon avis sur la bêta"
        url: "https://monportail.numerique-interieur.com"
        hint: "Votre avis s'ouvre dans le navigateur"
    # DM_LINKS_BY_APP (rendered as JSON). Per-application refinements, keyed
    # by device_type (matisse, pablo, libreoffice...). Same entry shape,
    # merged BY id over `links`: a partial entry ({id, url}) changes only
    # that field; {id, hidden: true} removes the link for that application.
    # Example:
    #   linksByApp:
    #     libreoffice:
    #       - id: search-portal
    #         hidden: true
    linksByApp: {}

  # S3-backed storage for enrollment payloads and distributed binaries
  # (default since horizontal scaling requires no RWO PVC on api/worker).
  storage:
    # DM_STORE_ENROLL_LOCALLY. Optional, default false (S3 mode). Set true
    # only for the local/no-S3 fallback (mounts an emptyDir, see
    # extraVolumes).
    storeEnrollLocally: false
    # DM_ENROLL_DIR. Optional, default "/data/enroll" (or "/tmp/enroll" on
    # worker/api roles that only need ephemeral scratch space).
    enrollDir: /tmp/enroll
    # DM_STORE_ENROLL_S3. Optional, default true.
    storeEnrollS3: true
    # DM_S3_BUCKET. Required when storeEnrollS3 or binariesMode=presign.
    bucket: ""
    # DM_S3_PREFIX_ENROLL. Optional, default "enroll/".
    prefixEnroll: "enroll/"
    # DM_S3_PREFIX_BINARIES. Optional, default "binaries/".
    prefixBinaries: "binaries/"
    # DM_BINARIES_MODE. Optional, default "presign". One of
    # presign|proxy|local.
    binariesMode: presign
    # DM_PRESIGN_TTL_SECONDS. Optional, default 300.
    presignTtlSeconds: 300
    # DM_S3_ENDPOINT_URL. Optional, default "". Set for S3-compatible
    # providers (e.g. MinIO in dev); leave empty for AWS S3.
    # MUST be the REGIONAL endpoint (https://s3.<region>.example.invalid),
    # never a bucket-specific hostname: the client uses virtual-host
    # addressing and would prepend the bucket a second time (TLS mismatch).
    s3EndpointUrl: ""

  # AWS region/tag metadata. Credentials (AWS_ACCESS_KEY_ID/
  # AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN) live under `secrets`, not here.
  aws:
    # AWS_REGION. Optional, default "".
    region: ""
    # AWS_DEFAULT_ORGANIZATION_ID. Optional, default "". Non-sensitive
    # tagging metadata used by the app's AWS calls.
    defaultOrganizationId: ""
    # AWS_DEFAULT_PROJECT_ID. Optional, default "".
    defaultProjectId: ""

  # Keycloak / OIDC. Required in production (DM_APP_ENV=prod).
  keycloak:
    # KEYCLOAK_ISSUER_URL. Required. Single source of truth for the SSO
    # base URL — DM_AUTH_ISSUER_URL and ADMIN_OIDC_ISSUER_URL are derived
    # from this + realm unless explicitly overridden below.
    issuerUrl: "https://sso.example.invalid"
    # KEYCLOAK_REALM. Required, default "openwebui".
    realm: openwebui
    # KEYCLOAK_CLIENT_ID. Required. Also reused verbatim as
    # ADMIN_OIDC_CLIENT_ID (the admin UI and the enrollment flow share one
    # OIDC client id).
    clientId: bootstrap-iassistant
    # KEYCLOAK_REDIRECT_URI. Required in prod — the dev default
    # (localhost:28443) is a desktop-loopback callback that Keycloak will
    # reject once a real client redirect_uri allow-list is enforced.
    redirectUri: "http://localhost:28443/callback"
    # KEYCLOAK_ALLOWED_REDIRECT_URI. Required in prod, see redirectUri.
    allowedRedirectUri: "http://localhost:28443/callback"
    # ADMIN_REQUIRED_GROUP. Optional, default "admin-dm". Keycloak group
    # required to reach /admin.
    adminRequiredGroup: admin-dm
    # ADMIN_OIDC_ISSUER_URL. Optional, default "" (auto-derives from
    # issuerUrl+realm). Override only for server-side calls routed through
    # an internal proxy with a different issuer host.
    adminOidcIssuerUrl: ""
    # ADMIN_OIDC_PUBLIC_ISSUER_URL. Optional, default "".
    adminOidcPublicIssuerUrl: ""

  # PKCE/OIDC access-token verification (bearer tokens presented to the API).
  auth:
    # DM_AUTH_VERIFY_ACCESS_TOKEN. Optional, default true. Never disable in
    # production.
    verifyAccessToken: true
    # DM_AUTH_JWKS_URL. Required when verifyAccessToken=true — JWKS endpoint
    # used to validate bearer tokens (typically the relay-assistant or
    # Keycloak certs endpoint).
    jwksUrl: ""
    # DM_AUTH_AUDIENCE. Optional, default "" (falls back to
    # KEYCLOAK_CLIENT_ID in the app if unset).
    audience: ""
    # DM_AUTH_ALLOWED_ALGORITHMS_CSV. Optional, default "RS256".
    allowedAlgorithmsCsv: RS256
    # DM_AUTH_LEEWAY_SECONDS. Optional, default 30. Clock-skew tolerance.
    leewaySeconds: 30
    # DM_AUTH_JWKS_CACHE_TTL_SECONDS. Optional, default 600.
    jwksCacheTtlSeconds: 600

  # Telemetry ingestion/relay to an upstream OTel collector.
  telemetry:
    # DM_TELEMETRY_ENABLED. Optional, default true.
    enabled: true
    # DM_TELEMETRY_PUBLIC_ENDPOINT. Optional, default "/telemetry/v1/traces".
    publicEndpoint: /telemetry/v1/traces
    # DM_TELEMETRY_AUTHORIZATION_TYPE. Optional, default "Bearer".
    authorizationType: Bearer
    # DM_TELEMETRY_UPSTREAM_ENDPOINT. Required when enabled — the OTLP/HTTP
    # traces endpoint traffic is forwarded to.
    upstreamEndpoint: "http://otel-collector.telemetry.svc.cluster.local:4318/v1/traces"
    # DM_TELEMETRY_UPSTREAM_AUTH_TYPE. Optional, default "Bearer".
    upstreamAuthType: Bearer
    # DM_TELEMETRY_TOKEN_TTL_SECONDS. Optional, default 300.
    tokenTtlSeconds: 300
    # DM_TELEMETRY_REQUIRE_TOKEN. Optional, default true.
    requireToken: true
    # DM_TELEMETRY_MAX_BODY_SIZE_MB. Optional, default 2.
    maxBodySizeMb: 2
    # DM_TELEMETRY_GRAFANA_URL. Optional, default "". Deep-link surfaced to
    # operators (e.g. a usage dashboard); purely informational.
    grafanaUrl: ""

  # Postgres non-secret identity (database name / user). The password and
  # full DSNs are secrets — see `secrets.values` below.
  postgres:
    # POSTGRES_DB. Optional, default "bootstrap".
    db: bootstrap
    # POSTGRES_USER. Optional, default "postgres".
    user: postgres

  # Relay-authorize gate (browser-extension plugin -> device-management
  # /relay/authorize). Optional block; only relevant if a relay/reverse-proxy
  # component (not deployed by this chart, see README "known quirks") is
  # placed in front of Keycloak/other upstreams.
  relay:
    # DM_RELAY_ENABLED. Optional, default true.
    enabled: true
    # DM_RELAY_KEY_TTL_SECONDS. Optional, default 2592000 (30 days).
    keyTtlSeconds: 2592000
    # DM_RELAY_ALLOWED_TARGETS_CSV. Optional, default "keycloak".
    allowedTargetsCsv: "keycloak,config,llm,mcr-api,telemetry"
    # DM_RELAY_REQUIRE_KEY_FOR_SECRETS. Optional, default true.
    requireKeyForSecrets: true
    # DM_RELAY_ASSISTANT_URL. Optional, default "". Base URL of the relay
    # reverse-proxy in front of Keycloak/other upstreams, if deployed
    # alongside this chart.
    assistantUrl: ""
    # RELAY_KEYCLOAK_UPSTREAM. Optional. Keycloak realm URL reached server-side
    # (by the api's /auth/token relay and by relayAssistant), e.g.
    # https://sso.example/realms/<realm>. MUST be a FQDN: the relay's nginx
    # resolver does not expand short names (render fails otherwise).
    keycloakUpstream: ""
    # DM_RELAY_FORCE_KEYCLOAK_ENDPOINTS. Optional, default false. When true,
    # the config served to plugins points keycloakTokenEndpoint at
    # {PUBLIC_BASE_URL}/auth/token and userinfo at /relay-assistant/keycloak/...
    forceKeycloakEndpoints: false

  # Models announced to the extensions in /config. Empty = feature disabled
  # on the extension side. Requests through llmProxy use the model the client
  # names, these are only the defaults.
  llm:
    # EMBD_MODEL_NAME. Embeddings model (local search indexing), e.g. bge-m3.
    embdModelName: ""
    # RERANK_MODEL_NAME. Reranking model (/llm/v1/rerank), e.g.
    # bge-reranker-v2-m3. Empty = no rerankEndpoint served.
    rerankModelName: ""

  # Fleet-state export run by the worker (PARC_EXPORT_SECRET lives in the
  # Secret). Defaults mirror app/settings.py.
  parc:
    # PARC_EXPORT_ENABLED. Optional, default false.
    enabled: false
    # PARC_EXPORT_URL. Target endpoint of the export.
    url: ""
    # PARC_EXPORT_INTERVALLE_S. Seconds between exports, default 300.
    intervalSeconds: 300
    # PARC_INSTANCE_LABEL. Label identifying this instance, default dm-x.
    instanceLabel: "dm-x"

# -----------------------------------------------------------------------------
# contentTemplate — NOT application config: these are plain string
# substitution tokens baked into the browser-extension/plugin template that
# device-management distributes to clients (DM-2). They ride on the same
# ConfigMap for convenience but have nothing to do with server behavior.
# All required in production; safe to leave empty in dev (renders an empty
# token client-side).
# -----------------------------------------------------------------------------
contentTemplate:
  # PUBLIC_BASE_URL. Public origin of this deployment, used both as a
  # content-template token and to derive the admin OIDC callback
  # (origin + /admin/callback).
  publicBaseUrl: "https://device-management.example.invalid"
  # LLM_BASE_URL. Base URL of the LLM API surfaced to clients.
  llmBaseUrl: "https://llm.example.invalid/v1"
  # DEFAULT_MODEL_NAME. Default model name surfaced to clients.
  defaultModelName: ""
  # API_BASE. Base URL the plugin uses for device-management API calls.
  apiBase: ""
  # RELAY_ASSISTANT_BASE_URL. Base URL of the relay reverse-proxy, if any.
  relayAssistantBaseUrl: ""
  # COMPTE_RENDU_URL. Base URL of the "compte rendu" companion service.
  compteRenduUrl: ""
  # COMU_URL. Base URL of the "comu" companion service.
  comuUrl: ""
  # TELEMETRY_ENDPOINT. Public telemetry ingestion endpoint surfaced to
  # clients (distinct from config.telemetry.upstreamEndpoint, which is the
  # server-side upstream).
  telemetryEndpoint: ""

# -----------------------------------------------------------------------------
# secrets — sensitive values. NEVER set real values as chart defaults; use
# --set-file/--set on the CLI, a gitignored values file, or (recommended in
# production) `existingSecret` to reference a Secret managed outside Helm
# (external-secrets, sealed-secrets, manual kubectl apply...).
# -----------------------------------------------------------------------------
secrets:
  # Set to the name of a pre-existing Secret to use instead of the one this
  # chart can create. When set, `create` and `values` below are ignored and
  # the Secret must contain every key application pods reference (see
  # values.schema.json / README for the full key list).
  existingSecret: ""
  # Create a Secret from `values` below. Optional, default true. Set to
  # false alongside an empty `existingSecret` only if you wire secretRefs
  # yourself via extraEnv on each component.
  create: true
  # Inline secret values (Secret stringData). Every key defaults to "" —
  # left blank, the corresponding env var is empty at runtime (some, e.g.
  # DATABASE_URL, will then fail application startup validation). Prefer
  # `--set secrets.values.KEY=...` or a separate, gitignored values file
  # over committing real values here.
  values:
    # ADMIN_SESSION_SECRET. Required in prod. Signs the admin UI session
    # cookie.
    ADMIN_SESSION_SECRET: ""
    # DM_CONFIG_SECRET_KEY. Optional but recommended. Encrypts runtime
    # config secret overrides (Fernet, derived via SHA-256) persisted from
    # /admin/debug. Without it, secret overrides can't be saved at runtime.
    DM_CONFIG_SECRET_KEY: ""
    # DM_RELAY_SECRET_PEPPER. Required in prod. Pepper mixed into relay
    # credential hashing.
    DM_RELAY_SECRET_PEPPER: ""
    # DM_RELAY_PROXY_SHARED_TOKEN. Required when a relay reverse-proxy is
    # deployed in front of this app.
    DM_RELAY_PROXY_SHARED_TOKEN: ""
    # DM_QUEUE_ADMIN_TOKEN. Required when queue.enabled=true (api/worker).
    # Bearer token protecting queue admin/introspection endpoints.
    DM_QUEUE_ADMIN_TOKEN: ""
    # DM_TELEMETRY_TOKEN_SIGNING_KEY. Required when config.telemetry.enabled.
    # HMAC key signing short-lived client telemetry tokens.
    DM_TELEMETRY_TOKEN_SIGNING_KEY: ""
    # DM_TELEMETRY_UPSTREAM_KEY. Required when config.telemetry.enabled and
    # the upstream collector requires a bearer credential.
    DM_TELEMETRY_UPSTREAM_KEY: ""
    # TELEMETRY_KEY. Content-template token (client-side telemetry key),
    # not the same as DM_TELEMETRY_UPSTREAM_KEY.
    TELEMETRY_KEY: ""
    # TELEMETRY_SALT. Content-template token (client-side hashing salt).
    TELEMETRY_SALT: ""
    # ADMIN_OIDC_CLIENT_SECRET. Optional: only needed if the Keycloak client
    # is confidential; leave empty for a public/PKCE client.
    ADMIN_OIDC_CLIENT_SECRET: ""
    # LLM_API_TOKEN. Required if the app calls an LLM API server-side (debug
    # page, etc), and by llmProxy when llmProxy.enabled=true.
    LLM_API_TOKEN: ""
    # LLM_BASE_URL. Required when llmProxy.enabled=true — the real upstream
    # LLM API base URL the proxy forwards to. Server-side only; never
    # exposed to clients (distinct from contentTemplate.llmBaseUrl, the
    # public-facing token handed to enrolled clients).
    LLM_BASE_URL: ""
    # DEFAULT_MODEL_NAME. Optional. Default model name used server-side by
    # llmProxy (distinct from contentTemplate.defaultModelName, the
    # client-facing token).
    DEFAULT_MODEL_NAME: ""
    # EMBD_MODEL_NAME. Optional. Default embeddings model for llmProxy's
    # /llm/v1/embeddings fallback when the client omits 'model'.
    EMBD_MODEL_NAME: ""
    # DM_LLM_TOKEN_SIGNING_KEY. Optional. Signs the short-lived per-client
    # llmToken minted by api and verified by llmProxy (dual auth alongside
    # the relay key). Required for that flow when llmProxy.enabled=true.
    DM_LLM_TOKEN_SIGNING_KEY: ""
    # PARC_EXPORT_SECRET. Required when config.parc.enabled. Shared secret
    # authenticating the fleet-state export (worker).
    PARC_EXPORT_SECRET: ""
    # AWS_ACCESS_KEY_ID. Required when config.storage.storeEnrollS3 or
    # binariesMode=presign (S3 credentials).
    AWS_ACCESS_KEY_ID: ""
    # AWS_SECRET_ACCESS_KEY. See AWS_ACCESS_KEY_ID.
    AWS_SECRET_ACCESS_KEY: ""
    # AWS_SESSION_TOKEN. Optional: only needed for temporary/STS credentials.
    AWS_SESSION_TOKEN: ""
    # POSTGRES_PASSWORD. Required by the internal dev postgres subchart
    # (postgres.internal.enabled=true). Not consumed directly by the app
    # when using an external database — DATABASE_URL already embeds it.
    POSTGRES_PASSWORD: ""
    # DATABASE_URL. Required. Application DSN, e.g.
    # postgresql://user:pass@host:5432/dbname
    DATABASE_URL: ""
    # DATABASE_ADMIN_URL. Required. Used by the migration Job (alembic
    # prefers it over DATABASE_URL) — migration 001 bootstraps an empty
    # database from db/schema.sql inline, including `CREATE EXTENSION
    # pgcrypto/citext`, which needs a privileged role (plain app credentials
    # are not enough on a fresh database). On managed Postgres where even
    # this role can't CREATE EXTENSION (e.g. AWS RDS), pre-create pgcrypto/
    # citext out-of-band before the first install.
    DATABASE_ADMIN_URL: ""
    # DB_ADMIN_PASSWORD. Reserved: not consumed by the app today. Kept for
    # parity with app/services/crypto.py SENSITIVE_ENV_VARS in case a
    # separate DB admin role is introduced later.
    DB_ADMIN_PASSWORD: ""

# -----------------------------------------------------------------------------
# vault — optional: instead of `secrets.create` (chart-managed Secret) or a
# manually-provisioned `secrets.existingSecret`, have the Vault Secrets
# Operator (VSO) own the runtime Secret by rendering a VaultStaticSecret CR
# (CRD `secrets.hashicorp.com/v1beta1`). Requires VSO already installed on
# the target cluster (this chart does not install it) and a VaultAuth CR
# already provisioned in this namespace (typically shared across apps and
# owned by platform/infra tooling, not by this chart).
#
# When enabled, `vault.enabled=true` overrides `secrets.create` — the
# chart's own Secret template is skipped regardless of `secrets.create`,
# since Helm must not also try to own the same Secret VSO creates. The
# Secret's *name* still follows the existing rule (`secrets.existingSecret`
# if set, else the chart-generated default `<fullname>-secrets`) — every
# Deployment keeps reading it via secretKeyRef exactly as in the non-Vault
# case, no template changes needed anywhere else.
#
# The Vault secret at `vault.path` must contain every key listed under
# `secrets.values` above (VSO syncs a KV payload verbatim into the
# destination Secret's data — there is no per-key selection in the CRD).
# -----------------------------------------------------------------------------
vault:
  enabled: false
  # Name of a pre-existing VaultAuth CR (Vault Secrets Operator CRD) in this
  # namespace. Required when vault.enabled=true. Not created by this chart.
  vaultAuthRef: ""
  # Optional, default true. VSO's own default for this field is false,
  # which means it silently skips syncing real Vault data into the
  # destination Secret if one already exists under that name (e.g. left
  # over from secrets.create=true before vault.enabled was turned on) — the
  # Secret object exists but never gets populated, which looks exactly like
  # "existingSecret doesn't take the values". True is almost always what
  # you want here; set false only if you deliberately want VSO to leave a
  # pre-existing same-named Secret alone.
  destinationOverwrite: true
  # KV mount path (e.g. "secret" for the default kv-v2 mount).
  mount: secret
  # KV secrets engine version backing `mount`: "kv-v1" or "kv-v2".
  type: kv-v2
  # Path within `mount` where the static secret lives (e.g.
  # "device-management/prod"). Required when vault.enabled=true.
  path: ""
  # How often VSO re-reads Vault and re-syncs the destination Secret.
  refreshAfter: 1h
  # Component keys (matching this file's top-level keys: api/admin/worker/
  # telemetryRelay/llmProxy) whose Deployment VSO should roll when the
  # synced Secret's content changes. Only lists components enabled by
  # default — add "llmProxy" too if you enable it.
  rolloutRestartTargets:
    - api
    - admin
    - worker
    - telemetryRelay

# -----------------------------------------------------------------------------
# postgres.internal — optional dev-only Postgres StatefulSet. Disabled by
# default: production is expected to point `secrets.values.DATABASE_URL` /
# `DATABASE_ADMIN_URL` at an externally managed database (see README install
# matrix) or enable `postgres.cnpg` below. Do not enable this in production.
#
# postgres.cnpg — optional CloudNativePG-managed Postgres Cluster
# (recommended for production instead of an out-of-band external database).
# Requires the CNPG operator to already be installed on the target cluster
# (CRD `clusters.postgresql.cnpg.io`) — this chart does not install the
# operator itself. Mutually exclusive with `postgres.internal.enabled`; the
# chart fails the render if both are enabled. When enabled, DATABASE_URL/
# DATABASE_ADMIN_URL are sourced directly from the Cluster's own
# operator-managed Secrets, not from `secrets.values`/`secrets.existingSecret`
# — the render also fails if those two keys are set alongside
# `postgres.cnpg.enabled=true`, since they would silently be ignored.
# -----------------------------------------------------------------------------
postgres:
  internal:
    enabled: false
    image:
      repository: docker.io/library/postgres
      tag: 18-alpine
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    persistence:
      enabled: true
      size: 20Gi
      storageClassName: ""
      accessModes:
        - ReadWriteOnce

  cnpg:
    # Optional, default false.
    enabled: false
    # Number of instances in the Cluster (1 primary + N-1 streaming
    # replicas). Optional, default 3 for production HA; set to 1 for a
    # single-instance, non-HA cluster.
    instances: 3
    storage:
      # Optional, default "" (empty). StorageClass backing each instance's
      # PGDATA volume. Leave empty to use the cluster's default
      # StorageClass (the `storageClass` field is then omitted from the
      # Cluster spec entirely, matching CNPG's own fallback behavior). Set
      # explicitly if the target cluster has no default StorageClass, or to
      # pick a non-default one (e.g. a faster/replicated class for PGDATA).
      storageClass: ""
      # Optional, default 2Gi. Per-instance size; CNPG does not support
      # shrinking a PVC afterward, so size for data + WAL retention headroom.
      size: 2Gi
    # Database created by `initdb` on first bootstrap. Optional, default
    # "bootstrap" (mirrors config.postgres.db's default — the two are
    # independent fields, since the app reads the dbname out of DATABASE_URL
    # rather than out of config.postgres.db, but keep them describing the
    # same database for operator sanity).
    database: bootstrap
    # Owner role of that database, created by `initdb`. Optional, default
    # "postgres" (mirrors config.postgres.user's default — see note above).
    owner: postgres
    # Applied to the "postgres" container of every instance Pod. On a
    # namespace with a ResourceQuota requiring requests/limits on every
    # container (e.g. "must specify limits.cpu for: ..."), leaving this
    # empty can leave the operator's *bootstrap* Job (the one-off
    # `<cluster>-1-initdb` Job CNPG runs on first install, containers
    # "bootstrap-controller"/"initdb") without resources too, depending on
    # your CNPG operator version — some versions only propagate this to the
    # instance Pods, not the bootstrap Job. If quota admission still
    # rejects the initdb Job after setting this, ask your platform team for
    # a namespace LimitRange with defaults (`default`/`defaultRequest`) —
    # that's the only way to satisfy a "must specify" quota for containers
    # in Jobs/Pods this chart doesn't itself template (CNPG's operator
    # generates that bootstrap Job's spec, not this chart).
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    # Passthrough to the Cluster's spec.postgresql.parameters (postgresql.conf
    # overrides, e.g. max_connections/shared_buffers). Optional, empty by
    # default — CNPG's own defaults apply.
    postgresql:
      parameters: {}

    # STOPGAP, default true — see device-management.cnpgSuperuserAdminUrlOverride
    # in _helpers.tpl for the full explanation. Until the upstream
    # device-management app makes its FastAPI startup hook's admin-privileged
    # role/database/schema bootstrap opt-in (currently unconditional on every
    # api/admin/telemetryRelay/llmProxy pod boot), those pods need genuine
    # postgres-superuser credentials to CREATE ROLE/CREATE DATABASE. This
    # makes DATABASE_ADMIN_URL on just those four components (never the
    # migration Job or worker) point at CNPG's superuser-managed Secret
    # instead of the app-role one, and sets enableSuperuserAccess: true on
    # the Cluster so that Secret exists at all. Set to false (and re-deploy)
    # once the upstream fix is live — the app will then no longer need or
    # use admin-privileged credentials at startup at all.
    temporaryStartupBootstrapNeedsSuperuser: true
