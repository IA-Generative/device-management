{{- if .Values.vault.enabled }}
{{- if not .Values.vault.vaultAuthRef }}
{{- fail "vault.vaultAuthRef is required when vault.enabled=true (name of a pre-existing VaultAuth CR in this namespace)." }}
{{- end }}
{{- if not .Values.vault.path }}
{{- fail "vault.path is required when vault.enabled=true (path within vault.mount where the static secret lives)." }}
{{- end }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "device-management.componentName" (dict "root" . "component" "vault-secret") }}
  labels:
    {{- include "device-management.labels" . | nindent 4 }}
  {{- include "device-management.annotations" (dict "root" . "wave" "-1") | nindent 2 }}
spec:
  vaultAuthRef: {{ .Values.vault.vaultAuthRef }}
  mount: {{ .Values.vault.mount | quote }}
  type: {{ .Values.vault.type | quote }}
  path: {{ .Values.vault.path | quote }}
  refreshAfter: {{ .Values.vault.refreshAfter | quote }}
  destination:
    create: true
    # Without this, VSO silently refuses to sync real Vault data into the
    # destination Secret if one already exists under that name (default
    # false) — e.g. a Secret the chart itself created back when
    # secrets.create=true/vault.enabled=false, before switching to Vault.
    overwrite: {{ .Values.vault.destinationOverwrite }}
    name: {{ include "device-management.secretName" . }}
    {{- with .Values.commonLabels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with .Values.vault.rolloutRestartTargets }}
  rolloutRestartTargets:
    {{- range . }}
    - kind: Deployment
      name: {{ include "device-management.componentName" (dict "root" $ "component" (include "device-management.serviceComponentSuffix" (dict "service" .))) }}
    {{- end }}
  {{- end }}
{{- end }}
