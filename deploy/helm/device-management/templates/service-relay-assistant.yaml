{{- if .Values.relayAssistant.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "device-management.componentName" (dict "root" . "component" "relay-assistant") }}
  labels:
    {{- include "device-management.componentLabels" (dict "root" . "component" "relay-assistant") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "device-management.componentSelectorLabels" (dict "root" . "component" "relay-assistant") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.relayAssistant.service.port }}
      targetPort: http
{{- end }}
