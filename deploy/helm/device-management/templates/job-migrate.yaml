{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # Fixed name (no release revision suffix): Helm hook Jobs are immutable,
  # so this chart deletes-then-recreates it on every install/upgrade via
  # the before-hook-creation delete policy below, mirroring how the plain
  # k8s manifests handle the same immutable-Job constraint.
  name: {{ include "device-management.componentName" (dict "root" . "component" "migrate") }}
  labels:
    {{- include "device-management.componentLabels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    # post-install (et non pre-install) : à la première installation, le
    # ServiceAccount et le Cluster CNPG sont des ressources ordinaires créées
    # après les hooks pre-* — un hook pre-install attendrait une base qui ne
    # peut pas encore exister. En upgrade, pre-upgrade migre avant le rollout.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": {{ .Values.migration.hookWeight | quote }}
    "helm.sh/hook-delete-policy": {{ .Values.migration.hookDeletePolicy }}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "device-management.componentSelectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "device-management.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "device-management.podSecurityContext" . | nindent 8 }}
      {{- if .Values.migration.waitForPostgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.worker.waitForPostgres.image.repository }}:{{ .Values.worker.waitForPostgres.image.tag }}"
          securityContext:
            {{- include "device-management.containerSecurityContext" . | nindent 12 }}
          command:
            - sh
            - -c
            - |
              host={{ .Values.migration.waitForPostgres.host | default (include "device-management.postgresHost" .) | quote }}
              if [ -z "$host" ]; then
                echo "migration.waitForPostgres.host is empty and no default database host could be resolved (neither postgres.internal nor postgres.cnpg is enabled) — set it explicitly, or disable migration.waitForPostgres.enabled" >&2
                exit 1
              fi
              timeout={{ .Values.migration.waitForPostgres.timeoutSeconds }}
              elapsed=0
              until pg_isready -h "$host" -U {{ .Values.config.postgres.user | quote }}; do
                elapsed=$((elapsed + 2))
                if [ "$elapsed" -ge "$timeout" ]; then
                  echo "timed out after ${timeout}s waiting for postgres at $host" >&2
                  exit 1
                fi
                echo "waiting for postgres at $host (${elapsed}/${timeout}s)...";
                sleep 2;
              done
          resources:
            {{- toYaml .Values.worker.waitForPostgres.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: alembic-migrate
          image: {{ include "device-management.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "device-management.containerSecurityContext" . | nindent 12 }}
          command: ["alembic", "upgrade", "head"]
          env:
            # alembic/env.py prefers DATABASE_ADMIN_URL over DATABASE_URL when
            # both are set. Migration 001 runs the full db/schema.sql inline
            # (CREATE EXTENSION pgcrypto/citext, all tables) to bootstrap an
            # empty database — CREATE EXTENSION has no privilege fallback, so
            # this Job needs the admin-privileged DSN, not the app runtime DSN
            # the other Deployments use for DATABASE_URL.
            {{- include "device-management.databaseEnv" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
