{{- if and .Values.llmProxy.enabled .Values.llmProxy.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "device-management.componentName" (dict "root" . "component" "llm-proxy") }}
  labels:
    {{- include "device-management.componentLabels" (dict "root" . "component" "llm-proxy") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "device-management.componentName" (dict "root" . "component" "llm-proxy") }}
  minReplicas: {{ .Values.llmProxy.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.llmProxy.autoscaling.maxReplicas }}
  {{- with .Values.llmProxy.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.llmProxy.autoscaling.targetCPUUtilizationPercentage }}
    {{- if .Values.llmProxy.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.llmProxy.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
